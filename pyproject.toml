[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gamepass-save-syncer"
version = "0.1.1"
description = "Back up, restore and move Xbox Game Pass for PC saves between Xbox accounts, and convert them for Steam/Epic."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
]

[project.scripts]
gss = "gss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gss = ["games.json"]
